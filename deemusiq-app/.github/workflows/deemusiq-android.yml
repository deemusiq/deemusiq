name: Build DeeMusiq (Android APK)

# How to use:
#  • Manual:  Actions tab → "Build DeeMusiq (Android APK)" → Run workflow
#  • Release: push a tag like v1.0.0  →  APK is attached to a GitHub Release
#  • Quality gate: every branch push / PR runs the `check` job only
#    (analyze + test); the APK `android` job builds on tags & manual runs,
#    after `check` passes.
#
# NOTE — this copy is for when ONLY the deemusiq-app/ folder is uploaded as its own
# GitHub repo (see README.DEEMUSIQ.md): there is no deemusiq-app/ prefix, so it has
# no working-directory and uploads dist/DeeMusiq.apk directly. In the full monorepo
# this copy does NOT run (GitHub only auto-discovers workflows under the repo-root
# .github/); the root .github/workflows/deemusiq-android.yml builds there instead.
# Keep both in sync — they are intentionally near-identical, not a conflict.
#
# Signing:
#  • For testing, this generates a TEMPORARY keystore automatically — the APK
#    installs fine for sideloading.
#  • For a PUBLIC release whose updates install over old versions, add repo
#    secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#    (see deemusiq-app/README.DEEMUSIQ.md). With the secret set, that stable
#    keystore is used instead.

on:
  workflow_dispatch:
  push:
    branches: ["**"] # branch pushes run only `check` (see job-level if on android)
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.5"
  FLUTTER_CHANNEL: "stable"

jobs:
  # Quality gate — runs on every branch push, PR, tag push and manual run.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (required by envied code generation)
        # Same as the build job's .env step — see the comments there.
        # On PRs from forks the secrets are empty; the check still passes.
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          cat > .env <<EOF
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_API_SECRET=${LASTFM_API_SECRET}
          ENABLE_UPDATE_CHECK=1
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=1
          EOF

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # --no-fatal-infos: the tree has known info-level lints (e.g.
        # avoid_print in lib/services/cli/cli.dart). Warnings/errors stay fatal.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  android:
    needs: check
    # Build only for releases: v* tag pushes and manual runs. `check` runs
    # (and gates) on those same events; branch pushes / PRs skip this job.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          flutter pub get
          # Spotube's helper sets up any native platform deps; non-fatal if it no-ops.
          dart cli/cli.dart install-dependencies --platform=android --arch=all || true

      - name: Generate DeeMusiq icons & splash
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml || dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Create .env (required by envied code generation)
        # env.dart is annotated @Envied(requireEnvFile: true, path: ".env"), so
        # build_runner aborts if .env is missing. The LastFM keys may be empty
        # (scrobbling just stays off); the build still succeeds. Set repo secrets
        # LASTFM_API_KEY / LASTFM_API_SECRET to enable Last.fm scrobbling.
        # Secrets are passed via env: (not interpolated into the script body).
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          cat > .env <<EOF
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_API_SECRET=${LASTFM_API_SECRET}
          ENABLE_UPDATE_CHECK=1
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=1
          EOF

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Set up signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secret (production / update-safe)."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/deemusiq.jks
            KS_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; K_PASS="$KEY_PASSWORD"
          else
            echo "::warning::No KEYSTORE_BASE64 secret — generating a TEMPORARY keystore."
            echo "::warning::APK installs for testing, but set a permanent keystore secret before public release so future updates install over old versions."
            KS_PASS=$(openssl rand -hex 16); ALIAS="deemusiq"; K_PASS="$KS_PASS"
            # WARNING: temporary keystore — for testing only. Use repo secrets for production.
            keytool -genkeypair -v -keystore android/app/deemusiq.jks -keyalg RSA -keysize 2048 \
              -validity 10000 -alias "$ALIAS" -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=DeeMusiq, OU=DeeMusiq, O=The Dembe Group, L=KwaZulu-Natal, C=ZA"
          fi
          cat > android/key.properties <<EOF
          storePassword=$KS_PASS
          keyPassword=$K_PASS
          keyAlias=$ALIAS
          storeFile=deemusiq.jks
          EOF

      - name: Guard — security dart-defines armed
        # Regression guard for the 2026-10 pentest (F1/F2/F6/F7): a release
        # built with empty security defines ships dead anti-tamper, unsigned
        # update/integrity checks and fail-closed payments. Fail loud instead.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DEEMUSIQ_CERT_SHA256: ${{ secrets.DEEMUSIQ_CERT_SHA256 }}
          DEEMUSIQ_SERVER_CERT_SHA256: ${{ secrets.DEEMUSIQ_SERVER_CERT_SHA256 }}
          DEEMUSIQ_PAYMENT_HMAC_SECRET: ${{ secrets.DEEMUSIQ_PAYMENT_HMAC_SECRET }}
          DEEMUSIQ_CHANNEL_KEY: ${{ secrets.DEEMUSIQ_CHANNEL_KEY }}
          DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY }}
          DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY: ${{ vars.DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY }}
        run: |
          fail=0
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Permanent-keystore build: the baked anti-tamper pin MUST equal the
            # actual signing cert hash, or the app bricks itself on first boot.
            actual=$(keytool -list -v -keystore android/app/deemusiq.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
            if [ -z "$DEEMUSIQ_CERT_SHA256" ]; then
              echo "::error::DEEMUSIQ_CERT_SHA256 is empty but a permanent keystore is in use — set it to $actual"; fail=1
            elif [ "$DEEMUSIQ_CERT_SHA256" != "$actual" ]; then
              echo "::error::DEEMUSIQ_CERT_SHA256 != signing cert hash ($actual) — the APK would brick itself on boot."; fail=1
            fi
          else
            echo "::notice::Temporary keystore build — DEEMUSIQ_CERT_SHA256 intentionally informational."
          fi
          for v in DEEMUSIQ_PAYMENT_HMAC_SECRET DEEMUSIQ_CHANNEL_KEY DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set — release builds must ship with all security defines armed (see audit_pentest_2026-10.md)."; fail=1
            fi
          done
          if [ -z "$DEEMUSIQ_SERVER_CERT_SHA256" ]; then
            echo "::warning::DEEMUSIQ_SERVER_CERT_SHA256 unset — TLS pin probe dormant. Set it once api.deemusiq.co.za is live; Cloudflare edge certs rotate, so keep a rotation list and be ready to ship pin updates."
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: Build release APK
        # Backend wiring is optional: when the repo var/secret are unset the
        # dart-defines are empty strings and the app keeps its offline default.
        # Passed via env: (not interpolated into the script body).
        env:
          DEEMUSIQ_BACKEND_URL: ${{ vars.DEEMUSIQ_BACKEND_URL }}
          DEEMUSIQ_CHANNEL_KEY: ${{ secrets.DEEMUSIQ_CHANNEL_KEY }}
          # SHA-256 of the PERMANENT signing certificate. When set, the app
          # refuses to run if signed with any other key (anti-repackaging).
          # Empty (temp keystore) = check is informational only.
          DEEMUSIQ_CERT_SHA256: ${{ secrets.DEEMUSIQ_CERT_SHA256 }}
          # SHA-256 of the backend's TLS leaf certificate (comma-separated
          # pins allowed for rotation). When set, the app pins the backend
          # cert and runs an active probe that locks money features on a
          # mismatch. Empty = standard PKI validation only.
          DEEMUSIQ_SERVER_CERT_SHA256: ${{ secrets.DEEMUSIQ_SERVER_CERT_SHA256 }}
          DEEMUSIQ_UPDATE_METADATA_URL: ${{ vars.DEEMUSIQ_UPDATE_METADATA_URL }}
          DEEMUSIQ_UPDATE_URL: ${{ vars.DEEMUSIQ_UPDATE_URL }}
          DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY }}
          # Ed25519 public key verifying the worker's X-Body-Signature header
          # on the published APK-hash payload. Empty = unsigned accepted.
          DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY: ${{ vars.DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY }}
          # Client-side payment request signing; must match the backend's
          # PAYMENT_HMAC_SECRET or checkouts fail closed (403). Empty = unsigned.
          DEEMUSIQ_PAYMENT_HMAC_SECRET: ${{ secrets.DEEMUSIQ_PAYMENT_HMAC_SECRET }}
        # `stableFdroid`: two flavor dimensions (default × store) mean a variant
        # needs one flavor from each. `stableFdroid` is the FOSS combo (no
        # google-services.json needed). Plain `--flavor stable` cannot resolve
        # the `store` dimension and fails at the assemble task.
        run: >
          flutter build apk --release --flavor stableFdroid
          --dart-define=DEEMUSIQ_BACKEND_URL="${DEEMUSIQ_BACKEND_URL}"
          --dart-define=DEEMUSIQ_CHANNEL_KEY="${DEEMUSIQ_CHANNEL_KEY}"
          --dart-define=DEEMUSIQ_CERT_SHA256="${DEEMUSIQ_CERT_SHA256}"
          --dart-define=DEEMUSIQ_SERVER_CERT_SHA256="${DEEMUSIQ_SERVER_CERT_SHA256}"
          --dart-define=DEEMUSIQ_PAYMENT_HMAC_SECRET="${DEEMUSIQ_PAYMENT_HMAC_SECRET}"
          --dart-define=DEEMUSIQ_UPDATE_METADATA_URL="${DEEMUSIQ_UPDATE_METADATA_URL:-https://deemusiq.co.za/downloads/version.json}"
          --dart-define=DEEMUSIQ_UPDATE_URL="${DEEMUSIQ_UPDATE_URL:-https://deemusiq.co.za/#download}"
          --dart-define=DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY="${DEEMUSIQ_UPDATE_ED25519_PUBLIC_KEY}"
          --dart-define=DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY="${DEEMUSIQ_INTEGRITY_ED25519_PUBLIC_KEY}"

      - name: Collect APK + publish its hash
        run: |
          mkdir -p dist
          # Prefer the flavored release APK; fall back deterministically.
          src=$(find build -name "app-stablefdroid-release.apk" -print -quit)
          [ -z "$src" ] && src=$(find build -name "*-release.apk" -print -quit)
          [ -z "$src" ] && src=$(find build -name "*.apk" -print -quit)
          if [ -z "$src" ]; then echo "::error::No APK found under build/"; exit 1; fi
          echo "Found APK: $src"
          cp "$src" dist/DeeMusiq.apk
          # The app fetches this to verify its own on-disk APK at runtime.
          ( cd dist && sha256sum DeeMusiq.apk | awk '{print $1}' > DeeMusiq.apk.sha256 )
          cat dist/DeeMusiq.apk.sha256
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeeMusiq-apk
          path: dist/DeeMusiq.apk*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeeMusiq.apk
            dist/DeeMusiq.apk.sha256
          name: DeeMusiq ${{ github.ref_name }}
          body: |
            DeeMusiq Android app — *It's a drop day.*

            **Install:** download `DeeMusiq.apk`, open it on your Android phone, and
            allow "install from unknown sources" when prompted.

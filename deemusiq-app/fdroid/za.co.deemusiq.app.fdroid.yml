# F-Droid inclusion metadata for DeeMusiq — fdroiddata merge request file.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ IMPORTANT — PACKAGE NAME (read before opening the fdroiddata MR)        │
# │                                                                         │
# │ The file name MUST equal the APK's applicationId. DeeMusiq's real       │
# │ applicationId (android/app/build.gradle, defaultConfig) is:             │
# │                                                                         │
# │     za.co.deemusiq.app                                                  │
# │                                                                         │
# │ and the F-Droid store flavor adds `applicationIdSuffix ".fdroid"`, so   │
# │ the APK F-Droid will build and sign is:                                 │
# │                                                                         │
# │     za.co.deemusiq.app.fdroid     ←  this file's name, and `fdroid build`│
# │                                   target below                          │
# │                                                                         │
# │ `oss.krtirtho.spotube` is ONLY the Kotlin source-code package of the    │
# │ upstream Spotube engine (deliberately kept, see AGENTS.md) — it is NOT  │
# │ the applicationId and must NOT be used as the F-Droid package name.     │
# │ If the project ever decides to ship the un-suffixed id on F-Droid,      │
# │ rename this file to za.co.deemusiq.app.yml and drop the flavor suffix.  │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Place this file in your fdroiddata fork as:
#   metadata/za.co.deemusiq.app.fdroid.yml


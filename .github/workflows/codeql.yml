name: CodeQL

# Static analysis for the JavaScript/TypeScript in the repo (download worker,
# static site, Astro docs site). Alerts land in the Security tab and GitHub
# emails repo admins. Dart is not a CodeQL language — flutter analyze +
# flutter test remain the Dart gate in every build workflow.

on:
  push:
    branches: [main, "payments/**", "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
